name: Feature request
description: Suggest a component, an improvement, or a Fumadocs UI feature docscn doesn't support yet.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening one, check the [Compatibility page](https://docscn.dev/docs/compatibility) and the [roadmap](https://github.com/ruiyuwg/docscn/issues/10): the feature may already be planned.
  - type: textarea
    id: request
    attributes:
      label: What would you like?
      description: The component or behaviour you'd like, and the problem it solves.
    validations:
      required: true
  - type: input
    id: fumadocs
    attributes:
      label: Fumadocs UI equivalent
      description: If Fumadocs UI has this, its module or component name, e.g. `fumadocs-ui/components/tabs`.
  - type: textarea
    id: details
    attributes:
      label: Additional context
      description: Examples, links or alternatives you've considered.
